command: ["uv", "run", "start-server"]

env:
  # Where request traces are written. Paste your MLflow experiment ID here (step 3).
  - name: MLFLOW_EXPERIMENT_ID
    value: "PASTE_YOUR_EXPERIMENT_ID_HERE"
  - name: MLFLOW_TRACKING_URI
    value: "databricks"

  # Serves a browser chat page for testing. Delete these two lines for an API-only app.
  - name: ENABLE_CHAT_UI
    value: "true"

  # Package index used when the app installs its dependencies.
  - name: PIP_INDEX_URL
    value: "https://pypi.org/simple/"
  - name: UV_INDEX_URL
    value: "https://pypi.org/simple/"
  - name: UV_DEFAULT_INDEX
    value: "https://pypi.org/simple/"
