[project]
name = "genie-router-agent"
version = "1.0.0"
description = "Routes a question to the right Genie agent and records which one answered"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks[langgraph]==0.6.0",
    "databricks-langchain==0.21.0",
    "mcp<2",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "databricks-agents>=1.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[project.scripts]
start-server = "runtime.main:main"
